<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Playwrite+BE+WAL+Guides&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>my awesome weather app</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-app-city" id="city"></h1>
            <p class="weather-app-details">
              <span id="time"></span>,
              <span id="description"></span>
              <br />
              Humidity: <strong id="humidity"></strong>, Wind:
              <strong id="wind-speed"></strong>
            </p>
          </div>
          <div class="weather-app-temperature-container">
            <div id="icon"></div>
            <div class="weather-app-temperature" id="temperature"></div>
            <div class="weather-app-unit-container" aria-label="Temperature unit">
              <button
                type="button"
                class="weather-app-unit active"
                id="celsius-link"
                aria-pressed="true"
              >
                °C
              </button>
              <span class="weather-app-unit-divider">/</span>
              <button
                type="button"
                class="weather-app-unit"
                id="fahrenheit-link"
                aria-pressed="false"
              >
                °F
              </button>
            </div>
          </div>
        </div>
        <div class="weather-forecast" id="forecast"></div>
        <section class="weather-ai" aria-labelledby="weather-ai-heading">
          <h2 id="weather-ai-heading">Weather tip</h2>
          <button
            type="button"
            class="search-form-button weather-ai-button"
            id="ai-weather-tip"
            disabled
          >
            Get an AI weather tip
          </button>
          <p id="ai-weather-tip-result" role="status" aria-live="polite"></p>
        </section>
        <section class="travel-guide" aria-labelledby="travel-guide-heading">
          <h2 id="travel-guide-heading">Travel guide</h2>
          <form id="travel-guide-form">
            <label for="travel-country">Which country would you like to explore?</label>
            <div class="travel-guide-controls">
              <input
                type="search"
                id="travel-country"
                class="search-form-input"
                placeholder="Enter a country"
                maxlength="80"
                required
              />
              <button type="submit" class="search-form-button" id="travel-guide-button">
                Generate guide
              </button>
            </div>
          </form>
          <p class="travel-guide-note">
            AI-generated inspiration; verify current details with official sources.
          </p>
          <p id="travel-guide-result" role="status" aria-live="polite"></p>
        </section>
        <section class="weather-journal" aria-labelledby="journal-heading">
          <h2 id="journal-heading">My journal</h2>
          <p class="journal-note">Your entries are saved only in this browser.</p>
          <div class="journal-field">
            <label for="journal-date">Date</label>
            <input id="journal-date" type="date" required />
          </div>
          <div class="journal-field">
            <label for="journal-entry">Write about your day</label>
            <textarea
              id="journal-entry"
              rows="8"
              placeholder="What happened today?"
            ></textarea>
          </div>
          <div class="journal-actions">
            <button type="button" class="search-form-button" id="save-journal-entry">
              Save entry
            </button>
            <button
              type="button"
              class="journal-delete-button"
              id="delete-journal-entry"
              disabled
            >
              Delete saved entry
            </button>
          </div>
          <p id="journal-status" role="status" aria-live="polite"></p>
        </section>
      </main>
      <footer>
        This project was coded by Coded by
        <a href="https://github.com/fabelanorma3010/" target="_blank"
          >Norma Fabela</a
        >
        code hosted on
        <a
          href="https://github.com/fabelanorma3010/My-cool-weather-app"
          target="_blank"
          >On GitHub</a
        >and webside hosted on
        <a href="https://my-cool-weather-app-sand.vercel.app/" target="_blank"
          >on Vercel</a
        >
      </footer>
    </div>
    <script src="index.js"></script>
  </body>
</html>
